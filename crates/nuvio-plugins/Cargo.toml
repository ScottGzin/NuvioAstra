url = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
nuvio-core = { path = "../nuvio-core" }
rquickjs = { version = "0.14", features = ["futures", "array-buffer", "parallel"] }
scraper = "0.29"
