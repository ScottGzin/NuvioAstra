[package]
name = "nuvio-player"
description = "Embedded libmpv player for Windows x64 (libmpv-2.dll loaded at runtime)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libloading = "0.9"
thiserror = { workspace = true }
serde = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_System_LibraryLoader"] }

[target.'cfg(not(windows))'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }
libc = "0.2"
