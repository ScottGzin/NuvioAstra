[workspace]
resolver = "3"
members = [
    "crates/nuvio-core",
    "crates/nuvio-store",
    "crates/nuvio-player",
    "crates/nuvio-sync",
    "crates/nuvio-p2p",
    "crates/nuvio-plugins",
    "apps/nuvio-probe",
    "apps/nuvio-desktop",
]

[workspace.package]
edition = "2024"
version = "0.2.5"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
regex = "1"
url = "2"
sha2 = "0.10"
base64 = "0.22"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
hex = "0.4"
pbkdf2 = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
