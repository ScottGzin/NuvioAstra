[workspace]
resolver = "3"
members = [
    "crates/nuvio-core",
    "crates/nuvio-store",
    "crates/nuvio-player",
    "crates/nuvio-sync",
    "crates/nuvio-p2p",
    "apps/nuvio-probe",
    "apps/nuvio-desktop",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", features = ["json"] }
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
