[package]
name = "nuvio-desktop"
description = "Nuvio Astra desktop app (Windows x64): Tauri 2 shell with the embedded libmpv player."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
nuvio-player = { path = "../../crates/nuvio-player" }
nuvio-core = { path = "../../crates/nuvio-core" }
nuvio-store = { path = "../../crates/nuvio-store" }
nuvio-sync = { path = "../../crates/nuvio-sync" }
nuvio-p2p = { path = "../../crates/nuvio-p2p" }
tauri-plugin-updater = "2"
# Local date without Win32 (already in the workspace lock through jiff).
jiff = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Controls_Dialogs"] }

[dev-dependencies]
# Same crate, `test` feature only (mock runtime + IPC helpers; no extra dependency).
tauri = { version = "2", features = ["test"] }
